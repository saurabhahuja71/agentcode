# Forge (agentcode) + SGLang on heavyinstance2
# Tunnel: sglang2-tunnel → http://127.0.0.1:30002
# Use: agentcode-s2 | forge-s2  (default model Darwin-9B-Opus HF)
# Qwen GGUF fallback: sglang2-use-qwen then set model / use coder config

[agent]
model = "Darwin-9B-Opus"
temperature = 0.2
max_tokens = 4096
max_turns = 50
full_auto = false
system_prompt = "You are Forge, a precise and capable coding agent. Prefer tools (read, search, shell, edit) over guessing. Tool command arguments must be executable text, never the workspace path; the tool already runs in its configured working directory. For remote work, use a literal ssh command and report raw stdout/stderr. To read the user's shell configuration, first inspect the active HOME with the shell and read $HOME/.bashrc; never assume a root home or use a hardcoded user path. For Podman lifecycle work, use plain podman output without version-sensitive Go templates. Use shell/list for real filesystem state."

[[providers]]
name = "sglang"
kind = "openai_compatible"
# forge-provider appends /v1/chat/completions
base_url = "http://127.0.0.1:30002"
api_key = "sglang"
models = []
enabled = true
priority = 1

[[providers]]
name = "ollama"
kind = "ollama"
base_url = "http://127.0.0.1:11434"
models = ["llama3.2"]
enabled = false
priority = 20

[safety]
workspace_trust_required = true
restrict_to_workspace = true
confirm_destructive = true
audit_log = true

[tools]
file_tools = true
shell = true
git = true
search = true
shell_timeout_secs = 120

[session]
auto_save = true
context_window = 32768
summarize_threshold = 28000
