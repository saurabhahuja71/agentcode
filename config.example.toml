# Forge configuration
# Copy to ~/.forge/config.toml or pass with: forge --config path/to.toml
#
# Local stacks that work well:
#   - Ollama (kind = "ollama") — daily GGUF coding models
#   - SGLang / vLLM / llama.cpp server (kind = "openai_compatible")
# base_url is the server root; Forge appends /v1/chat/completions when needed.

[agent]
model = "llama3.2"
temperature = 0.2
max_tokens = 8192
max_turns = 50
full_auto = false
permission_mode = "allow"
system_prompt = "You are Forge, a precise and capable coding agent. Prefer tools (read, search, shell, edit) over guessing."

# Providers are tried in priority order (lower = first)
[[providers]]
name = "ollama"
kind = "ollama"
base_url = "http://127.0.0.1:11434"
models = ["llama3.2", "codellama", "qwen2.5-coder", "qwen2.5-coder:32b"]
enabled = true
priority = 10

# SGLang (or any OpenAI-compatible local server). Disable Ollama above or raise
# its priority if you want SGLang first. models = [] accepts any served name.
# [[providers]]
# name = "sglang"
# kind = "openai_compatible"
# base_url = "http://127.0.0.1:30000"
# api_key = "sglang"
# models = []
# enabled = true
# priority = 1
#
# Then set e.g.:
# [agent]
# model = "qwen2.5-coder-32b-q4_k_m.gguf"

[[providers]]
name = "openai"
kind = "openai_compatible"
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini"]
enabled = false
priority = 20

[[providers]]
name = "groq"
kind = "openai_compatible"
base_url = "https://api.groq.com/openai"
api_key_env = "GROQ_API_KEY"
models = ["llama-3.3-70b-versatile"]
enabled = false
priority = 30

[safety]
workspace_trust_required = true
restrict_to_workspace = false
confirm_destructive = true
audit_log = true
# allowed_commands defaults include podman, docker, systemctl, journalctl, ssh, and
# other common Linux/dev tools. Uncomment to customize:
# allowed_commands = ["ls", "cat", "ssh", "sudo", "podman", ...]

[tools]
file_tools = true
shell = true
git = true
search = true
http = true
shell_timeout_secs = 120

[session]
# storage_dir defaults to ~/.forge/sessions
auto_save = true
context_window = 128000
summarize_threshold = 100000

